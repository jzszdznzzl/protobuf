name: Update Google protos

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm update:protos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pull requests opened with GITHUB_TOKEN do not trigger the CI workflow,
      # so the checks run here, before anything is proposed.
      - run: pnpm typecheck
      - run: pnpm test
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/update-protos
          commit-message: 'chore: update Google protos'
          title: 'chore: update Google protos'
          body: |
            Automated refresh of the bundled Google `.proto` files.
            The upstream revisions are recorded in `protos/README.md`.
          delete-branch: true
